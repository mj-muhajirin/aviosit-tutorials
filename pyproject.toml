[project]
name = "aviosit-tutorials"
version = "0.1.0"
description = "Practical tutorials and examples covering AI, data science, and software engineering, mainly using Python alongside other languages and technologies."
readme = "README.md"
authors = [
    { name = "AviosIT", email = "muhajirin.msc@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "huggingface-hub>=1.8.0",
    "langchain-core>=0.3.86",
    "llama-index-core>=0.14.16",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "torch>=2.8.0",
    "transformers>=4.12.2",
]

[project.scripts]
aviosit-tutorials = "aviosit_tutorials:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
]
